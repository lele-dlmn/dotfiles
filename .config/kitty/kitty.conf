# vim:fileencoding=utf-8:foldmethod=marker

kitty_mod ctrl+shift

#    ____          __    
#   / __/__  ___  / /____
#  / _// _ \/ _ \/ __(_-<
# /_/  \___/_//_/\__/___/
#: Fonts {{{
font_family      GoMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 13.0

adjust_line_height 0
adjust_column_width 0

symbol_map U+2100-U+2124 SpaceMono Nerd Font

disable_ligatures never

map kitty_mod+g>d disable_ligatures_in active always
map kitty_mod+d>e disable_ligatures_in active never

box_drawing_scale 0.001, 1, 1.5, 2
#: }}}


#   _____                     
#  / ___/_ _________ ___  ____
# / /__/ // / __(_-</ _ \/ __/
# \___/\_,_/_/ /___/\___/_/   
#: Cursor customization {{{
cursor #cccccc
cursor_text_color #eceff1

cursor_shape underline
cursor_underline_thickness 1.0

shell_integration no-cursor

cursor_blink_interval -1
cursor_stop_blinking_after 15.0
#: }}}


#    ____             ______            __  
#   / __/__________  / / / /  ___ _____/ /__
#  _\ \/ __/ __/ _ \/ / / _ \/ _ `/ __/  '_/
# /___/\__/_/  \___/_/_/_.__/\_,_/\__/_/\_\ 
#: Scrollback {{{
scrollback_lines 2000

scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

scrollback_pager_history_size 0

wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0
#: }}}


#    __  ___                 
#   /  |/  /__  __ _____ ___ 
#  / /|_/ / _ \/ // (_-</ -_)
# /_/  /_/\___/\_,_/___/\__/ 
#: Mouse {{{
mouse_hide_wait 3.0

url_color #0087bd
url_style curly

open_url_with default
detect_urls yes

copy_on_select no

strip_trailing_spaces never

select_by_word_characters @-./_~?&=%+#

click_interval -1.0

focus_follows_mouse no
#: }}}


#    ___          ___                                
#   / _ \___ ____/ _/__  ______ _  ___ ____  _______ 
#  / ___/ -_) __/ _/ _ \/ __/  ' \/ _ `/ _ \/ __/ -_)
# /_/   \__/_/ /_/ \___/_/ /_/_/_/\_,_/_//_/\__/\__/ 
#: Performance tuning {{{
repaint_delay 10
input_delay 3

sync_to_monitor yes
#: }}}


#    ___      ____
#   / _ )___ / / /
#  / _  / -_) / / 
# /____/\__/_/_/  
#: Terminal bell {{{
enable_audio_bell no
visual_bell_duration 0.0

window_alert_on_bell yes

bell_on_tab yes
limit is applied.
#: }}}


#    __                       __ 
#   / /  ___ ___ _____  __ __/ /_
#  / /__/ _ `/ // / _ \/ // / __/
# /____/\_,_/\_, /\___/\_,_/\__/ 
#           /___/                
#: Window layout {{{
remember_window_size  yes
initial_window_width  700
initial_window_height 500

enabled_layouts *

window_resize_step_cells 2
window_resize_step_lines 2

window_border_width 0.0
draw_minimal_borders yes

window_margin_width 17.0
single_window_margin_width -1000

window_padding_width 0.0

placement_strategy center

active_border_color #00ff00
inactive_border_color #cccccc
bell_border_color #ff5a00

inactive_text_alpha 1.0

hide_window_decorations no

resize_debounce_time 0.1
resize_draw_strategy static
#: }}}


#  ______     __     ___          
# /_  __/__ _/ /    / _ )___ _____
#  / / / _ `/ _ \  / _  / _ `/ __/
# /_/  \_,_/_.__/ /____/\_,_/_/   
#: Tab bar {{{
tab_bar_edge bottom
tab_bar_margin_width 0.0

tab_bar_style powerline
tab_powerline_style slanted

tab_fade 0.25 0.5 0.75 1
tab_separator " |"

tab_title_template {title}

# background_opacity 0.98

active_tab_foreground   #000
active_tab_background   #eee
active_tab_font_style   bold-italic
inactive_tab_foreground #444
inactive_tab_background #999
inactive_tab_font_style normal
#: }}}


#   _____     __           
#  / ___/__  / /__  _______
# / /__/ _ \/ / _ \/ __(_-<
# \___/\___/_/\___/_/ /___/
include vacuous2.conf
Color for marks of type 2


#    ___     __                          __
#   / _ |___/ /  _____ ____  _______ ___/ /
#  / __ / _  / |/ / _ `/ _ \/ __/ -_) _  / 
# /_/ |_\_,_/|___/\_,_/_//_/\__/\__/\_,_/  
#: Advanced {{{
shell .
editor .

close_on_child_death no

remote_control_password yes

# env
update_check_interval 24
startup_session none
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

term xterm-kitty
#: }}}


#   ____  ____  __                  __      
#  / __ \/ __/ / /__    _____ ___ _/ /__ ___
# / /_/ /\ \  / __/ |/|/ / -_) _ `/  '_/(_-<
# \____/___/  \__/|__,__/\__/\_,_/_/\_\/___/
#: OS specific tweaks {{{
macos_titlebar_color system
macos_option_as_alt no
macos_hide_from_tasks no
macos_quit_when_last_window_closed no
macos_window_resizable yes
macos_thicken_font 0
macos_traditional_fullscreen no
macos_show_window_title_in_menubar yes
macos_custom_beam_cursor no
#: }}}


#    __ __         __   _         __  
#   / //_/__ __ __/ /  (_)__  ___/ /__
#  / ,< / -_) // / _ \/ / _ \/ _  (_-<
# /_/|_|\__/\_, /_.__/_/_//_/\_,_/___/
#          /___/                      
#: Keyboard shortcuts {{{
kitty_mod ctrl+shift
clear_all_shortcuts no


#: Clipboard

#: Copy to clipboard
map kitty_mod+c copy_to_clipboard
#: Paste from clipboard
map kitty_mod+v paste_from_clipboard

#: Paste from selection
map kitty_mod+s  paste_from_selection

#: Pass selection to program
map kitty_mod+o pass_selection_to_program


#: Scrolling {{{

#: Scroll line up
map kitty_mod+up    scroll_line_up
map kitty_mod+k     scroll_line_up
#: Scroll line down
map kitty_mod+down    scroll_line_down
map kitty_mod+j       scroll_line_down

#: Scroll page up
map kitty_mod+page_up scroll_page_up
#: Scroll page down
map kitty_mod+page_down scroll_page_down

#: Scroll to top
map kitty_mod+home scroll_home
#: Scroll to bottom
map kitty_mod+end scroll_end
#: }}}


#   _      ___        __  ___                                       __ 
#  | | /| / (_)__    /  |/  /__ ____  ___ ____ ____ __ _  ___ ___  / /_
#  | |/ |/ / / _ \  / /|_/ / _ `/ _ \/ _ `/ _ `/ -_)  ' \/ -_) _ \/ __/
#  |__/|__/_/_//_/ /_/  /_/\_,_/_//_/\_,_/\_, /\__/_/_/_/\__/_//_/\__/ 
#                                        /___/                         
#: Window management {{{

#: New window
map kitty_mod+enter new_window
#: New OS window
map kitty_mod+n new_os_window

#: Close window
map kitty_mod+w close_window

#: Next window
map kitty_mod+] next_window
#: Previous window
map kitty_mod+[ previous_window

#: Move window forward
map kitty_mod+f move_window_forward
#: Move window backward
map kitty_mod+b move_window_backward

#: Move window to top
map kitty_mod+` move_window_to_top

#: Start resizing window
map kitty_mod+r start_resizing_window

#: First window
map kitty_mod+1 first_window
#: Second window
map kitty_mod+2 second_window
#: Third window
map kitty_mod+3 third_window
#: Fourth window
map kitty_mod+4 fourth_window
#: Fifth window
map kitty_mod+5 fifth_window
#: Sixth window
map kitty_mod+6 sixth_window
#: Seventh window
map kitty_mod+7 seventh_window
#: Eighth window
map kitty_mod+8 eighth_window
#: Ninth window
map kitty_mod+9 ninth_window
#: Tenth window
map kitty_mod+0 tenth_window
#: }}}


#  ______     __     __  ___                                       __ 
# /_  __/__ _/ /    /  |/  /__ ____  ___ ____ ____ __ _  ___ ___  / /_
#  / / / _ `/ _ \  / /|_/ / _ `/ _ \/ _ `/ _ `/ -_)  ' \/ -_) _ \/ __/
# /_/  \_,_/_.__/ /_/  /_/\_,_/_//_/\_,_/\_, /\__/_/_/_/\__/_//_/\__/ 
#                                       /___/                         
#: Tab management {{{

#: Next tab
map kitty_mod+right next_tab
#: Previous tab
map kitty_mod+left previous_tab

#: New tab
map kitty_mod+t new_tab

#: Close tab
map kitty_mod+q close_tab
#: Close OS window
map shift+cmd+w close_os_window

#: Move tab forward
map kitty_mod+. move_tab_forward
#: Move tab backward
map kitty_mod+, move_tab_backward
#: }}}


#    __                       __    __  ___                                       __ 
#   / /  ___ ___ _____  __ __/ /_  /  |/  /__ ____  ___ ____ ____ __ _  ___ ___  / /_
#  / /__/ _ `/ // / _ \/ // / __/ / /|_/ / _ `/ _ \/ _ `/ _ `/ -_)  ' \/ -_) _ \/ __/
# /____/\_,_/\_, /\___/\_,_/\__/ /_/  /_/\_,_/_//_/\_,_/\_, /\__/_/_/_/\__/_//_/\__/ 
#           /___/                                      /___/                         
#: Layout management {{{

#: Next layout
map kitty_mod+l next_layout
#: }}}


#    ____          __        _        
#   / __/__  ___  / /_  ___ (_)__ ___ 
#  / _// _ \/ _ \/ __/ (_-</ /_ // -_)
# /_/  \___/_//_/\__/ /___/_//__/\__/ 
#: Font sizes {{{

#: Increase font size
map kitty_mod+equal  change_font_size all +2.0
#: Decrease font size
map kitty_mod+minus       change_font_size all -2.0

#: Reset font size
map kitty_mod+backspace change_font_size all 0
#: }}}


#    ____    __        __  _             
#   / __/__ / /__ ____/ /_(_)__  ___  ___
#  _\ \/ -_) / -_) __/ __/ / _ \/ _ \(_-<
# /___/\__/_/\__/\__/\__/_/\___/_//_/___/
#: Select and act on visible text {{{

map kitty_mod+e kitten hints

#::  Open a currently visible URL using the keyboard. The program used
#::  to open the URL is specified in open_url_with.

#: Insert selected path
kitty_mod+p>f kitten hints --type path --program -
#: Open selected path
map kitty_mod+p>shift+f kitten hints --type path

#: Insert selected line
map kitty_mod+p>l kitten hints --type line --program -

#: Insert selected word
map kitty_mod+p>w kitten hints --type word --program -

#: Insert selected hash
map kitty_mod+p>h kitten hints --type hash --program -
#: }}}


#    __  ____             ____                          
#   /  |/  (_)__ _______ / / /__ ____  ___ ___  __ _____
#  / /|_/ / (_-</ __/ -_) / / _ `/ _ \/ -_) _ \/ // (_-<
# /_/  /_/_/___/\__/\__/_/_/\_,_/_//_/\__/\___/\_,_/___/
#: Miscellaneous {{{

#: Show documentation
map kitty_mod+f1 show_kitty_doc overview

#: Toggle fullscreen
map kitty_mod+f11 toggle_fullscreen

#: Unicode input
map kitty_mod+u    kitten unicode_input

#: Edit config file
map kitty_mod+f2 edit_config_file

#: Open the kitty command shell
map kitty_mod+escape kitty_shell window

#: Increase background opacity
map kitty_mod+a>m set_background_opacity +0.1
#: Decrease background opacity
map kitty_mod+a>l set_background_opacity -0.1

#: Make background fully opaque
map kitty_mod+a>1 set_background_opacity 1
#: Reset background opacity
map kitty_mod+a>d set_background_opacity default

#: Reset the terminal
map kitty_mod+delete clear_terminal reset active
#: }}}

#: }}}
